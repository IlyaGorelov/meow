in_source: |-
  byte[] format = new byte[32];

  int i = 0;

  # reading format part of the string (input should be < 32 chars long)
  byte cur_char = hear();
  while (cur_char != '\n') {
      format[i] = cur_char;

      i = i + 1;
      cur_char = hear();
  }

  format[i] = 0;

  cur_char = hear();

  # reading numbers and converting them
  int[] numbers = new int[16];
  int number_count = 0;

  while (cur_char != 0) {
      int value = 0;
      int sign = 1;

      if (cur_char == '-') {
          sign = -1;
          i = i + 1;
          cur_char = hear();
      } else {
          if (cur_char == '+') {
              i = i + 1;
              cur_char = hear();
          }
      }

      while (cur_char >= '0' && cur_char <= '9') {
          value = value * 10 + cur_char - '0';
          i = i + 1;
          cur_char = hear();
      }

      numbers[number_count] = value * sign;
      number_count = number_count + 1;

      if (cur_char == '\n') {
          i = i + 1;
          cur_char = hear();
      }
  }

  # formatting string
  int number_index = 0;
  i = 0;

  while (format[i] != 0) {
      if (format[i] != '%') {
          meow(format[i]);
          i = i + 1;
      } else {
          i = i + 1;

          int left = 0;
          int width = 0;

          if (format[i] == '-') {
              left = 1;
              i = i + 1;
          }

          while (format[i] >= '0' && format[i] <= '9') {
              width = width * 10 + format[i] - '0';
              i = i + 1;
          }

          i = i + 1;

          value = numbers[number_index];
          number_index = number_index + 1;

          byte[] digits = new byte[11];
          int count = 0;
          int negative = 0;

          if (value < 0) {
              negative = 1;
              value = -value;
          }

          if (value == 0) {
              digits[count] = '0';
              count = count + 1;
          }

          while (value > 0) {
              digits[count] = value % 10 + '0';
              count = count + 1;
              value = value / 10;
          }

          if (negative == 1) {
              digits[count] = '-';
              count = count + 1;
          }

          int padding = width - count;

          if (padding < 0) {
              padding = 0;
          }

          if (left == 0) {
              while (padding > 0) {
                  meow(' ');
                  padding = padding - 1;
              }
          }

          int j = count - 1;

          while (j >= 0) {
              meow(digits[j]);
              j = j - 1;
          }

          if (left == 1) {
              padding = width - count;

              if (padding < 0) {
                  padding = 0;
              }

              while (padding > 0) {
                  meow(' ');
                  padding = padding - 1;
              }
          }
      }
  }
