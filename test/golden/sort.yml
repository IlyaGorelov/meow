in_source: |-
  int[] array = new int[20];

  int cur_number = 1;
  int i = 0;

  while (cur_number != 0) {
      cur_number = hear();

      if (cur_number != 0) {
          array[i] = cur_number;
          i = i + 1;
      }
  }

  int[] sorted = new int[20];

  int length = i;

  i = 0;
  while (i < length) {
      sorted[i] = array[i];
      i = i + 1;
  }

  int sortedFlag = 0;

  while (sortedFlag == 0) {
      sortedFlag = 1;
      i = 0;

      while (i < length - 1) {
          if (sorted[i] > sorted[i + 1]) {
              int t = sorted[i];
              sorted[i] = sorted[i + 1];
              sorted[i + 1] = t;

              sortedFlag = 0;
          }

          i = i + 1;
      }
  }

  i = 0;
  while (i < length) {
      meow(sorted[i]);
      i = i + 1;
  }

