in_source: |-
  long a = 324235230005200052;
  long b = 34343;

  long c = 324235230005234395;

  string t = "true";
  string f = "false";

  if (a+b==c){
      writeline(t);
  }
  else{
      writeline(f);
  }


  void writeline(string s){
      int i = 0;
      byte cur = s[i];

      while(cur!=0){
          meow(cur);
          i=i+1;
          cur = s[i];
      }
  }

