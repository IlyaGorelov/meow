in_source: |-
  int number = hear();

  int res = is_prime(number);

  if (res == 1) {
      meow('P');
  } else {
      if (res == 0) {
          meow('N');
      } else {
          meow('I');
      }
  }

  int is_prime(int n){
      if (n<1){
          return -1;
      }
      if(n==1){
          return 0;
      }

      int i = 2;

      while (i < n) {
              if (n % i == 0) {
                  return 0;
              }

              i = i + 1;
      }
      return 1;
  }
